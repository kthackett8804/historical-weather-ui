<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Weather Atlas dashboard">
    <span class="brand-mark" aria-hidden="true">☁</span>
    <span>Weather Atlas</span>
  </a>

  <nav class="quick-links" aria-label="Quick links">
    <a routerLink="/weather">Explore</a>
    <a routerLink="/analytics">Analyse</a>
    <a routerLink="/comparison">Compare</a>
  </nav>

  <button
    class="menu-toggle"
    type="button"
    aria-controls="primary-navigation"
    [attr.aria-expanded]="menuOpen"
    [attr.aria-label]="menuOpen ? 'Close navigation' : 'Open navigation'"
    (click)="toggleMenu()"
  >
    <span aria-hidden="true">{{ menuOpen ? '×' : '☰' }}</span>
  </button>
</header>

<div class="app-layout">
  <aside id="primary-navigation" class="sidebar" [class.is-open]="menuOpen">
    <nav aria-label="Main navigation">
      <a
        routerLink="/"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Dashboard
      </a>
      <a
        routerLink="/weather"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        Weather
      </a>
      <a
        routerLink="/analytics"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        Analytics
      </a>
      <a
        routerLink="/favourites"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        My Weather
      </a>
      <a
        routerLink="/comparison"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        Compare
      </a>
      <a
        routerLink="/reviews"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        Reviews
      </a>
      <a
        routerLink="/profile/preview"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        My Account
      </a>
      <a
        routerLink="/admin/users"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        Admin
      </a>
    </nav>
  </aside>

  <main id="main-content" class="main-content">
    <router-outlet />
  </main>
</div>
